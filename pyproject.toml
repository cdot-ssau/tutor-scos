[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-scos"
dynamic = ["version"]
dependencies = [
]
requires-python = ">=3.10"
authors = [
  { name="kosolapovlb", email="kosolapovlb@gmail.com" },
]
description = "Плагин для интеграции сборки OpenedX Tutor с ГИС СЦОС"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
tutor = [
  "tutor>=22.0.0,<23.0.0",
  "tutor-mfe>=22.0.0,<23.0.0",
]

[project.urls]
Repository = "https://github.com/cdot-ssau/tutor-scos"
Issues = "https://github.com/cdot-ssau/tutor-scos/issues"

[project.entry-points."tutor.plugin.v1"]
scos = "scos.plugin"

[project.entry-points."lms.djangoapp"]
scos = "scos.apps:ScosConfig"

[project.entry-points."cms.djangoapp"]
scos = "scos.apps:ScosConfig"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
